<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <title>mapped!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23111214' stroke='%23f4f4f0' stroke-width='4'/><circle cx='16' cy='16' r='5' fill='%23f0243c'/></svg>" />
    <!-- Painted before the stylesheet and script arrive, so a slow connection sees the app loading, not a blank page. -->
    <style>
      html, body { margin: 0; min-height: 100%; background: #000; color: #fff; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #000 radial-gradient(circle at 1px 1px, #ffffff0d 1px, transparent 0) 0 0 / 24px 24px;
        font: 600 14px/1.3 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 0.02em; color: #8f8f8f;
      }
      .boot-lines { display: flex; flex-direction: column; gap: 5px; width: 52px; }
      .boot-lines i { display: block; height: 7px; border-radius: 4px; transform-origin: left; animation: boot 1.2s ease-in-out infinite; }
      .boot-lines i:nth-child(1) { background: #2f6fe8; }
      .boot-lines i:nth-child(2) { background: #ee352e; width: 85%; animation-delay: 0.1s; }
      .boot-lines i:nth-child(3) { background: #ff6319; width: 70%; animation-delay: 0.2s; }
      .boot-lines i:nth-child(4) { background: #8cc63f; width: 55%; animation-delay: 0.3s; }
      @keyframes boot { 50% { transform: scaleX(0.35); } }
      @media (prefers-reduced-motion: reduce) { .boot-lines i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Loading mapped!…</span>
      </div>
    </div>
    <noscript><p style="padding: 24px; font-family: sans-serif">mapped! needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
