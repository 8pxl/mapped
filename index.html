<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <title>mapped!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23111214' stroke='%23f4f4f0' stroke-width='4'/><circle cx='16' cy='16' r='5' fill='%23f0243c'/></svg>" />
  </head>
  <body>
    <main id="menu" class="screen">
      <div class="menu-wrap">
        <header class="topbar">
          <a class="brand" href="/" aria-label="mapped! home">
            <span class="brand-lines" aria-hidden="true"><i style="--c: #2f6fe8"></i><i style="--c: #ee352e"></i><i style="--c: #ff6319"></i><i style="--c: #8cc63f"></i></span>
            mapped!
          </a>
          <button id="open-settings" class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
          </button>
        </header>

        <div class="menu-grid">
          <div class="picker">
            <section class="pick-section" aria-labelledby="game-label">
              <h2 class="eyebrow" id="game-label">Game</h2>
              <div id="modes" class="mode-tabs" role="radiogroup" aria-labelledby="game-label"></div>
              <p id="mode-desc" class="mode-desc"></p>
            </section>
            <section class="pick-section" aria-labelledby="region-label">
              <div class="region-cols">
                <h2 class="eyebrow" id="region-label">Region</h2><span aria-hidden="true">Countries</span><span aria-hidden="true">Best</span>
              </div>
              <div id="regions" class="region-list"></div>
            </section>
          </div>
          <aside id="preview" class="preview" aria-live="polite"></aside>
        </div>
      </div>
      <div id="start-bar" class="start-bar"></div>
    </main>

    <main id="play" class="screen" hidden>
      <header class="hud">
        <div class="hud-left">
          <button class="btn-ghost" id="back" aria-label="Back to menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <span id="hud-badge" class="badge"></span>
          <div class="hud-title">
            <span id="hud-region"></span>
            <small><span id="hud-mode"></span><span id="hud-practice" class="practice" hidden></span></small>
          </div>
        </div>
        <div class="hud-mid">
          <span id="hud-bar" class="track"><i></i></span>
          <span id="hud-progress" class="figure"></span>
        </div>
        <div class="hud-right">
          <span id="hud-streak" class="streak" hidden></span>
          <span class="stat"><small>Score</small><b id="hud-score" class="figure"></b></span>
          <span class="stat"><small>Time</small><b id="hud-time" class="figure"></b></span>
          <button id="hud-sound" class="icon-btn" aria-label="Mute">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /><path class="slash" d="M16 9l6 6M22 9l-6 6" /></svg>
          </button>
        </div>
      </header>

      <div id="map-host" class="map-host">
        <div id="ticket" class="ticket" aria-live="polite"></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <div class="zoom">
          <button id="zoom-in" class="pointer-only" aria-label="Zoom in">+</button>
          <button id="zoom-out" class="pointer-only" aria-label="Zoom out">&minus;</button>
          <button id="zoom-reset" aria-label="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" /></svg>
          </button>
        </div>
        <button id="show-results" class="btn" hidden>Show results</button>
        <aside class="legend" aria-label="Map key">
          <h3>Key</h3>
          <ul>
            <li><i class="k-first"></i>First try</li>
            <li><i class="k-retry"></i>Took retries</li>
            <li><i class="k-missed"></i>Missed</li>
          </ul>
        </aside>
      </div>
    </main>

    <dialog id="settings" class="settings">
      <header class="settings-head">
        <h2>Settings</h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </header>
      <label class="setting"><span><b>Sound</b><small>Clicks, stamps and chimes</small></span><input type="checkbox" id="opt-sound" class="toggle" /></label>
      <label class="setting pointer-only"><span><b>Show names on hover</b><small>Practice mode. Runs aren't ranked.</small></span><input type="checkbox" id="opt-hints" class="toggle" /></label>
      <div class="setting-keys pointer-only">
        <b>Keyboard</b>
        <dl>
          <div><dt><kbd>Space</kbd></dt><dd>Click whatever is under the cursor</dd></div>
          <div><dt><kbd>S</kbd></dt><dd>Skip the current country</dd></div>
          <div><dt><kbd>Pinch</kbd> <kbd>⌘ scroll</kbd></dt><dd>Zoom</dd></div>
          <div><dt><kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd></dt><dd>Pick a region and start, on the menu</dd></div>
        </dl>
      </div>
    </dialog>

    <dialog id="results" class="results">
      <div id="results-body"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
