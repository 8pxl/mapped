<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111214" />
    <title>mapped!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23111214' stroke='%23f4f4f0' stroke-width='4'/><circle cx='16' cy='16' r='5' fill='%23f0243c'/></svg>" />
  </head>
  <body>
    <main id="menu" class="screen">
      <div class="menu-wrap">
        <header class="masthead">
          <div class="masthead-line" aria-hidden="true">
            <i style="--c: #2aa8f2"></i><i style="--c: #f0243c"></i><i style="--c: #ff8a1c"></i><i style="--c: #9a4dff"></i><i style="--c: #7cd23c"></i><i style="--c: #ff3fb4"></i>
          </div>
          <h1 class="wordmark">mapped!</h1>
          <p class="subtitle">Flags &amp; countries <span>Map quiz</span></p>
        </header>

        <section class="menu-step">
          <h2 class="step"><span class="step-num">1</span> Mode</h2>
          <div id="modes" class="modes"></div>
        </section>

        <section class="menu-step">
          <h2 class="step"><span class="step-num">2</span> Region</h2>
          <div id="regions" class="regions"></div>
        </section>

        <footer class="options">
          <label class="check"><input type="checkbox" id="opt-hints" /> <span>Show names on hover <small>practice · unranked</small></span></label>
          <label class="check"><input type="checkbox" id="opt-sound" /> <span>Sound</span></label>
          <p class="tips"><kbd>Space</kbd> clicks under the cursor <kbd>S</kbd> skips <kbd>Pinch</kbd> or <kbd>⌘ scroll</kbd> zooms</p>
        </footer>
      </div>
    </main>

    <main id="play" class="screen" hidden>
      <header class="hud">
        <div class="hud-left">
          <button class="btn-ghost" id="back" aria-label="Back to menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <span id="hud-badge" class="badge"></span>
          <div class="hud-title">
            <span id="hud-region"></span>
            <small><span id="hud-mode"></span><span id="hud-practice" class="practice" hidden></span></small>
          </div>
        </div>
        <div class="hud-mid">
          <span id="hud-bar" class="track"><i></i></span>
          <span id="hud-progress" class="figure"></span>
        </div>
        <div class="hud-right">
          <span id="hud-streak" class="streak" hidden></span>
          <span class="stat"><small>Score</small><b id="hud-score" class="figure"></b></span>
          <span class="stat"><small>Time</small><b id="hud-time" class="figure"></b></span>
          <button id="hud-sound" class="icon-btn" aria-label="Mute">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /><path class="slash" d="M16 9l6 6M22 9l-6 6" /></svg>
          </button>
        </div>
      </header>

      <div id="map-host" class="map-host">
        <div id="ticket" class="ticket" aria-live="polite"></div>
        <div id="toast" class="toast" role="status"></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <div class="zoom">
          <button id="zoom-in" aria-label="Zoom in">+</button>
          <button id="zoom-out" aria-label="Zoom out">&minus;</button>
          <button id="zoom-reset" aria-label="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6" /></svg>
          </button>
        </div>
        <button id="show-results" class="btn" hidden>Show results</button>
        <aside class="legend" aria-label="Map key">
          <h3>Key</h3>
          <ul>
            <li><i class="k-first"></i>First try</li>
            <li><i class="k-retry"></i>Took retries</li>
            <li><i class="k-missed"></i>Missed</li>
          </ul>
        </aside>
      </div>
    </main>

    <dialog id="results" class="results">
      <div id="results-body"></div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
